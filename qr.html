<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1628" />
    <title>Suri–Brown · Seating QR code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="qr-page">
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="qr-main">
      <p class="hero__eyebrow">Guest wayfinding</p>
      <h1 class="hero__brand">Suri–Brown</h1>
      <p class="hero__headline">Scan for your seat</p>
      <p class="hero__lede qr-lede">
        Print this page or screenshot the code. Guests scan it to open the seating finder.
      </p>

      <section class="qr-card">
        <div id="qr-code" class="qr-code" aria-label="QR code linking to the seating page"></div>
        <label class="field qr-url-field">
          <span class="field__label">Destination URL</span>
          <input id="qr-url" type="url" spellcheck="false" />
        </label>
        <div class="qr-actions">
          <button type="button" id="qr-update" class="btn btn--primary">Update QR</button>
          <button type="button" id="qr-print" class="btn btn--ghost">Print</button>
        </div>
        <p class="qr-hint">
          Defaults to this site’s homepage. After GitHub Pages is live, paste
          <code>https://mr7brown.github.io/suri-brown-seating/</code> (or your custom domain).
        </p>
      </section>

      <p class="qr-back"><a class="footer-link" href="index.html">← Back to seating finder</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script type="module" src="js/qr.js"></script>
  </body>
</html>
